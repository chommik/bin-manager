[package]
name = "bin-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
dirs = "6.0.0"
env_logger = { version = "0.11.8", features = ["auto-color", "humantime"], default-features = false }
indicatif = "0.18.3"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11+spec-1.1.0"
reqwest = { version = "0.13.1", features = ["blocking", "http2", "native-tls"], default-features = false }
tempfile = "3.24.0"
sha2 = { version = "0.10.9", features = ["asm"] }
data-encoding = "2.10.0"
nix = { version = "0.31.1", features = ["feature"] }
strfmt = "0.2.5"
url = "2.5.8"
flate2 = { version = "1.1.8", default-features = false, features = ["zlib"] }
bzip2 = { version = "0.6.1", default-features = false, features = ["bzip2-sys"] }
xz = { version = "0.1.0", default-features = false }
tar = { version = "0.4.44", default-features = false }

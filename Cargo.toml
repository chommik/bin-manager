[package]
name = "bin-manager"
version = "0.2.0"
description = "Bootstrap your ~/.local/bin (or other directory) with precompiled binaries"
authors = [
    "Rafal Macyszyn <rafal@v92.pl>",
]
license = "BSD-2"
license-file = "LICENSE"
edition = "2024"

[dependencies]
bzip2 = { version = "0.6.1" }
clap = { version = "4.5.56", features = ["derive"] }
current_platform = "0.2.0"
data-encoding = "2.10.0"
digest-io = "0.1.0"
dirs = "7.0.0"
env_logger = { version = "0.11.8", features = ["auto-color", "humantime"], default-features = false }
flate2 = { version = "1.1.8", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18.3"
log = "0.4.29"
nix = { version = "0.32.0", features = ["feature"] }
reqwest = { version = "0.13.1", features = ["blocking", "http2", "rustls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { version = "0.11.2" }
strfmt = "0.2.5"
tar = { version = "0.4.44", default-features = false }
tempfile = "3.24.0"
toml = "1.2.3+spec-1.1.0"
url = "2.5.8"
xz = { version = "0.1.0", default-features = false }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
